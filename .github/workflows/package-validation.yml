name: package-validation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "packages/**"
      - "packaging/**"
      - ".github/workflows/package-validation.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "packages/**"
      - "packaging/**"
  workflow_dispatch:

jobs:
  cargo-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Cargo package metadata
        run: |
          cargo metadata --format-version 1 --no-deps > /tmp/meta.json
          node -e '
            const m = require("/tmp/meta.json");
            const p = m.packages.find(p => p.name === "ctx-cli");
            if (!p) throw new Error("package ctx-cli not found in cargo metadata");
            console.log("name:", p.name, "| version:", p.version, "| targets:", p.targets.map(t => t.name).join(", "));
            if (p.version !== "0.1.0" && p.version === "") throw new Error("version missing");
            if (!p.targets.some(t => t.name === "ctx" && t.kind.includes("bin"))) throw new Error("bin target ctx missing");
          '

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All package versions match Cargo.toml
        run: |
          set -euo pipefail
          version="$(grep '^version' Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')"
          echo "Cargo version: $version"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const files = [
              "packages/npm/cli/package.json",
              "packages/npm/linux-x64/package.json",
              "packages/npm/linux-arm64/package.json",
              "packages/npm/darwin-x64/package.json",
              "packages/npm/darwin-arm64/package.json",
              "packages/npm/win32-x64/package.json",
              "packages/npm/win32-arm64/package.json",
            ];
            for (const f of files) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              if (p.version !== v) throw new Error(`${f} version ${p.version} != ${v}`);
            }
            const meta = JSON.parse(fs.readFileSync("packages/npm/cli/package.json", "utf8"));
            for (const k of Object.keys(meta.optionalDependencies)) {
              if (meta.optionalDependencies[k] !== v) throw new Error(`optionalDependencies.${k} ${meta.optionalDependencies[k]} != ${v}`);
            }
            console.log("✓ all npm package versions match");
          ' "$version"
          grep 'version "'"$version"'"' packaging/homebrew/tap/Formula/ctx.rb > /dev/null
          echo "✓ homebrew formula version matches"
          grep "PackageVersion: $version" packaging/winget/CTX.yaml > /dev/null
          grep "PackageVersion: $version" packaging/winget/CTX.locale.en-US.yaml > /dev/null
          grep "PackageVersion: $version" packaging/winget/CTX.installer.yaml > /dev/null
          echo "✓ winget versions match"
          grep '"version": "'"$version"'"' packaging/scoop/ctx.json > /dev/null
          echo "✓ scoop version matches"

  npm-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate launcher syntax
        run: node --check packages/npm/cli/bin/ctx.js
      - name: Validate all package.json are well-formed
        run: |
          set -e
          for f in packages/npm/cli/package.json packages/npm/linux-x64/package.json \
                    packages/npm/linux-arm64/package.json packages/npm/darwin-x64/package.json \
                    packages/npm/darwin-arm64/package.json packages/npm/win32-x64/package.json \
                    packages/npm/win32-arm64/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok: $f')"
          done
      - name: npm pack dry-run (platform + meta)
        run: |
          set -e
          for d in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64 cli; do
            (cd "packages/npm/$d" && npm pack --dry-run >/dev/null 2>&1 && echo "pack ok: $d")
          done

  homebrew-formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check formula
        run: ruby -c packaging/homebrew/tap/Formula/ctx.rb

  winget-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML validity
        run: |
          set -e
          for f in packaging/winget/CTX.yaml packaging/winget/CTX.locale.en-US.yaml packaging/winget/CTX.installer.yaml; do
            ruby -e "require 'yaml'; YAML.unsafe_load_file('$f'); puts 'ok: $f'"
          done
      - name: Installer manifest has required fields
        run: |
          ruby -e '
            require "yaml"
            y = YAML.unsafe_load_file("packaging/winget/CTX.installer.yaml")
            %w[PackageIdentifier PackageVersion InstallerType Installers].each { |k| raise "missing #{k}" unless y.key?(k) }
            y["Installers"].each do |i|
              raise "installer missing Architecture" unless i["Architecture"]
              raise "installer missing InstallerUrl" unless i["InstallerUrl"]
              hash = i["InstallerSha256"].to_s.sub(/\A"/, "").sub(/"\z/, "")
              raise "installer missing InstallerSha256" unless hash =~ /\A[0-9a-f]{64}\z/
            end
            puts "✓ winget installer manifest valid"
          '

  scoop-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scoop manifest
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("packaging/scoop/ctx.json", "utf8"));
            if (!m.version) throw new Error("version missing");
            for (const arch of ["64bit", "arm64"]) {
              const a = m.architecture[arch];
              if (!a || !a.url || !a.hash || !a["bin"]) throw new Error(`${arch} incomplete`);
              if (!/^[0-9a-f]{64}$/.test(a.hash)) throw new Error(`${arch} hash invalid`);
            }
            if (!m.checkver || !m.autoupdate) throw new Error("checkver/autoupdate missing");
            console.log("✓ scoop manifest valid");
          '

  install-script-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning scripts/install.sh scripts/build-release.sh scripts/verify-release.sh scripts/generate-checksums.sh scripts/stage-npm-binaries.sh
          else
            echo "shellcheck not available; skipping"
          fi
      - name: powershell syntax check (pwsh)
        shell: pwsh
        run: |
          $tokens = $null
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "✓ install.ps1 parses cleanly"