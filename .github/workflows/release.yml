name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- version consistency gate ---------------------------------------------
  # Fails the release before publishing if any packaging version diverges from
  # Cargo.toml (single source of truth).
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package versions match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^version' Cargo.toml | head -1 | sed -E 's/version *= *"([^"]+)"/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag v${tag} != Cargo version ${version}" >&2
            exit 1
          fi
          for f in packages/npm/cli/package.json \
                   packages/npm/linux-x64/package.json \
                   packages/npm/linux-arm64/package.json \
                   packages/npm/darwin-x64/package.json \
                   packages/npm/darwin-arm64/package.json \
                   packages/npm/win32-x64/package.json \
                   packages/npm/win32-arm64/package.json; do
            node -e "const p=require('./$f'); if(p.version!=='$version'){console.error('$f has '+p.version);process.exit(1)}"
          done
          node -e "const p=require('./packages/npm/cli/package.json'); for(const k of Object.keys(p.optionalDependencies)){if(p.optionalDependencies[k]!=='$version'){console.error('optionalDependencies.'+k+' mismatch');process.exit(1)}}"
          echo "✓ all package versions are ${version}"

  # ---- build matrix ----------------------------------------------------------
  release:
    needs: verify-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: ctx-linux-x86_64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: ctx-linux-aarch64
            cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: ctx-macos-x86_64
            cross: false
          - os: macos-15
            target: aarch64-apple-darwin
            name: ctx-macos-aarch64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: ctx-windows-x86_64.exe
            cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: ctx-windows-aarch64.exe
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross for cross targets
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (${{ matrix.target }})
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Smoke test
        if: matrix.cross == 'false'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ctx"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" --help > /dev/null

      - name: Stage artifact
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ctx"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  checksums:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ctx-* > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/

  publish:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: |
            ## ctx ${{ github.ref_name }}

            **New in this release:** see [CHANGELOG.md](CHANGELOG.md).

            **Supported languages:** TypeScript, JavaScript, Python, Rust, Go.

            ### Install

            ```bash
            # Homebrew (macOS / Linux)
            brew tap halloffame12/CTX
            brew install ctx

            # npm
            npm install -g ctxai-cli

            # Rust
            cargo install ctxai-cli

            # Direct download (below)
            # macOS / Linux
            curl -fsSL https://github.com/halloffame12/CTX/releases/latest/download/ctx-linux-x86_64 -o ctx
            chmod +x ctx && ./ctx --version
            ```

            **Verification:** every artifact hash is in `checksums.txt`
            (SHA-256). Never run an unverified binary.
          generate_release_notes: true