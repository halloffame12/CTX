[package]
name = "ctxai-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Codebase intelligence and context engine for AI coding agents"
license = "MIT"
repository = "https://github.com/halloffame12/CTX"
homepage = "https://github.com/halloffame12/CTX"
keywords = ["mcp", "code-intelligence", "code-graph", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
default-run = "ctx"
include = [
    "Cargo.toml",
    "src/**/*.rs",
    "tests/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[[bin]]
name = "ctx"
path = "src/main.rs"

[lib]
name = "ctx"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
ignore = "0.4.33"
libc = "0.2"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26.12"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"